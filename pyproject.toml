[tool.poetry]
name = "postgresbackup"
version = "0.1.0"
description = ""
authors = ["gabrielhmango <gabrielhmango@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.0.0"
taskipy = "^1.14.1"
ruff = "^0.9.10"

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'

[tool.taskipy.tasks]
config_user = "git config --global user.name \"gabrielhmango\""
config_email = "git config --global user.email \"gabrielhmango@gmail.com\""
pre_test = "task format && task lint"
test = "pytest --cov=fastapi_from_zero -vv"
post_test = "coverage html"
format = "ruff check . --fix && ruff format ."
lint = "ruff check . && ruff check . --diff"
pre_commit = 'task test && task config_user && task config_email && git add . && git status'
commit = "git commit -S -m"
post_commit = "git push"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
